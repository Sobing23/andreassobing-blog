# Baut die Seite bei jeder Änderung auf "main" und veröffentlicht sie über GitHub Pages
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      alle:
        description: "Alle Seiten der Sitemap per IndexNow melden"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Meldet geänderte Artikel per IndexNow an Bing und andere Suchmaschinen, sobald sie online sind
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Geänderte Seiten melden
        if: github.event_name == 'push'
        run: python3 tools/indexnow.py "${{ github.event.before }}" "${{ github.sha }}"
      - name: Alle Seiten melden
        if: github.event_name == 'workflow_dispatch' && inputs.alle
        run: python3 tools/indexnow.py --alle
